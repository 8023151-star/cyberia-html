<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000c2c">
  <title>Connect 4 — Cyberia</title>
  <style>
    :root{color-scheme:dark;--bg:#000c2c;--panel:#0b1d43;--line:#2c416d;--text:#f5f7ff;--muted:#a9b7d4;--accent:#ad8aff;--red:#f16f83;--yellow:#f3cf69}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 8%,#17326e,var(--bg) 58%);color:var(--text);font-family:Inter,system-ui,sans-serif}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.shell{max-width:920px;margin:auto;padding:0 22px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff22}.topbar a:first-child{font-size:13px;color:var(--muted)}.brand{font-size:16px;font-weight:900;letter-spacing:.1em}.brand span{color:var(--accent)}h1{text-align:center;margin:35px 0 7px;font-size:clamp(36px,6vw,54px);letter-spacing:-.05em}h1 span{color:var(--accent)}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin:0 0 25px}.setup{max-width:590px;margin:32px auto;padding:28px;border:1px solid var(--line);border-radius:19px;background:var(--panel);box-shadow:0 20px 60px #0005}.setup h2{margin:0 0 8px;font-size:25px}.setup p{color:var(--muted);font-size:14px;line-height:1.5}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.choice{border:1px solid #3a5180;border-radius:12px;padding:17px 12px;background:#112751;color:#eef3ff;text-align:left;font-weight:800}.choice small{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:500}.choice.selected{border-color:var(--accent);background:#342768;box-shadow:0 0 0 2px #ad8aff44}.side-pick{padding-top:2px}.side-pick p{margin:5px 0}.side-pick .choice-row{margin:10px 0 18px}.red-text{color:var(--red)}.yellow-text{color:var(--yellow)}.primary{border:0;border-radius:10px;padding:13px 20px;background:var(--accent);color:#08132e;font-weight:850}.primary:hover{background:#c6b0ff}.primary:disabled{opacity:.4;cursor:not-allowed}.setup .primary{width:100%}.play-area{max-width:650px;margin:auto}.status-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px;margin-bottom:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:13px}.status-row strong{font-size:16px}.status-row .red{color:var(--red)}.status-row .yellow{color:var(--yellow)}#status{text-align:center;color:#d9e2f5}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:1.4%;width:100%;padding:2.3%;border:2px solid #5278ce;border-radius:18px;background:#2957b3;box-shadow:0 18px 40px #0008}.cell{display:grid;place-items:center;aspect-ratio:1;border:0;border-radius:50%;background:#061a42;box-shadow:inset 0 5px 8px #0009,0 2px #94b3f344}.cell:not(:disabled):hover{background:#244371}.cell.red{background:var(--red);box-shadow:inset 0 4px #ffffff77,inset 0 -5px #a12f4b}.cell.yellow{background:var(--yellow);box-shadow:inset 0 4px #ffffff77,inset 0 -5px #a67d24}.cell.winning{outline:4px solid #fff;outline-offset:-6px}.actions{display:flex;justify-content:center;gap:12px;margin:20px 0 40px}.secondary{border:1px solid #3b5180;border-radius:9px;padding:10px 15px;background:#102550;color:#dce5f6;font-size:13px;font-weight:700}.secondary:hover{border-color:var(--accent)}.result{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#000b}.result-card{max-width:360px;width:100%;padding:28px;border:1px solid var(--accent);border-radius:17px;background:#0b1d43;text-align:center}.result-card h2{font-size:28px;margin:0 0 8px}.result-card p{color:var(--muted);margin-bottom:22px}.result-card .primary,.result-card .secondary{margin:4px}[hidden]{display:none!important}:focus-visible{outline:2px solid #7cf0cf;outline-offset:3px}@media(max-width:520px){.shell{padding:0 12px}.setup{padding:18px}.choice{padding:13px 9px;font-size:13px}.choice small{font-size:11px}.status-row{font-size:11px;padding:10px}.status-row strong{font-size:12px}.board{border-radius:10px}.cell.winning{outline-width:2px;outline-offset:-3px}}
  </style>
  <script src="connect4.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a href="../../index.html">← All G4mes</a><a class="brand" href="../../index.html">CYBERIA<span>.</span></a></header>
    <main><h1>CONNECT <span>4</span></h1><p class="subtitle">Four in a row wins. Pick your match and drop in.</p>
      <section class="setup" id="setup"><h2>Choose your G4me</h2><p>Play together on this device or take on the bot.</p><div class="choice-row"><button class="choice" type="button" data-mode="friend">You vs friend<small>Take turns on one screen</small></button><button class="choice" type="button" data-mode="bot">You vs bot<small>A solo match</small></button></div><div class="side-pick" id="side-pick" hidden><p>Pick your color. Red goes first.</p><div class="choice-row"><button class="choice" type="button" data-color="1"><span class="red-text">●</span> Play red</button><button class="choice" type="button" data-color="2"><span class="yellow-text">●</span> Play yellow</button></div></div><button class="primary" id="start" type="button" disabled>Start G4me →</button></section>
      <section class="play-area" id="play-area" hidden><div class="status-row"><strong class="red" id="red-label">Red</strong><span id="status" role="status">Red's turn</span><strong class="yellow" id="yellow-label">Yellow</strong></div><div class="board" id="board" role="grid" aria-label="Connect 4 board"></div><div class="actions"><button class="secondary" id="rematch" type="button">Rematch ↻</button><button class="secondary" id="change-mode" type="button">Change mode</button></div></section>
    </main>
  </div>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="result-title">Winner!</h2><p id="result-text"></p><button class="primary" id="play-again" type="button">Play again</button><button class="secondary" id="result-change" type="button">Change mode</button></div></div>
</body>
</html>
