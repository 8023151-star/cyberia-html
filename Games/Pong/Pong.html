<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000c2c">
  <title>Pong — Cyberia</title>
  <style>
    :root{color-scheme:dark;--bg:#000c2c;--panel:#0b1d43;--line:#2b416e;--text:#f5f7ff;--muted:#aab8d4;--purple:#ad8aff;--mint:#7cf0cf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 8%,#172d66,var(--bg) 60%);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.shell{max-width:1100px;margin:auto;padding:0 22px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff22}.topbar a:first-child{color:var(--muted);font-size:13px}.brand{font-size:16px;font-weight:900;letter-spacing:.1em}.brand span{color:var(--purple)}h1{text-align:center;margin:30px 0 6px;font-size:clamp(42px,7vw,66px);letter-spacing:.08em}h1 span{color:var(--purple)}.subtitle{text-align:center;margin:0 0 25px;color:var(--muted);font-size:14px}.scoreboard{display:flex;align-items:center;justify-content:center;gap:35px;margin-bottom:15px}.scoreboard>div{text-align:center;min-width:95px}.scoreboard small{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.12em}.scoreboard strong{display:block;font-size:35px}.scoreboard b{color:#8191b6}.scoreboard .left-score{color:var(--mint)}.scoreboard .right-score{color:var(--purple)}.arena{position:relative;max-width:900px;margin:auto;border:2px solid #486098;border-radius:15px;overflow:hidden;box-shadow:0 25px 60px #0008}.arena canvas{display:block;width:100%;height:auto;aspect-ratio:9/5;background:#06112f}.screen{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:#06112fee}.screen[hidden]{display:none}.menu-card{width:min(100%,470px);padding:24px;border:1px solid #495f92;border-radius:15px;background:#0d2049;text-align:center;box-shadow:0 15px 40px #0008}.menu-card h2{margin:0 0 7px;font-size:25px}.menu-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:19px 0}.choice{border:1px solid #40547d;border-radius:9px;padding:12px 8px;background:#142952;color:#eaf0ff;font-size:13px;font-weight:800}.choice.selected{border-color:var(--purple);background:#392b70;box-shadow:0 0 0 2px #ad8aff44}.side-pick{margin-top:3px}.side-pick p{font-size:12px}.side-pick .choices{margin:9px 0 17px}.primary{border:0;border-radius:9px;padding:12px 22px;background:var(--purple);color:#0a1531;font-size:13px;font-weight:850}.primary:hover{background:#cbb4ff}.primary:disabled{opacity:.4;cursor:not-allowed}.menu-card>.primary{width:100%}.below{max-width:900px;margin:14px auto 0;display:flex;align-items:center;justify-content:space-between;gap:14px}.controls{color:#c1cde5;font-size:12px}.controls kbd{display:inline-block;margin:0 2px;padding:4px 6px;border:1px solid #3c507b;border-radius:5px;background:#142951;color:#fff;font:700 11px inherit}.actions{display:flex;gap:8px}.secondary{border:1px solid #3c507b;border-radius:8px;padding:9px 12px;background:#11264d;color:#dbe5f8;font-size:12px;font-weight:700}.secondary:hover{border-color:var(--purple)}.touch{display:none;max-width:900px;margin:18px auto;justify-content:space-between;gap:10px}.touch button{min-width:72px;min-height:50px;border:1px solid #476292;border-radius:8px;background:#132950;color:#fff;font-size:20px;touch-action:none}.touch .group{display:flex;gap:8px}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--mint);outline-offset:3px}@media(max-width:650px){.shell{padding:0 12px}.screen{position:relative;min-height:320px}.arena canvas{min-height:230px}.below{flex-wrap:wrap}.touch{display:flex}.scoreboard{margin-bottom:10px}.scoreboard strong{font-size:28px}.menu-card{padding:17px}.choices{margin:12px 0}.choice{padding:10px 6px;font-size:12px}}
  </style>
  <script src="pong.js" defer></script>
</head>
<body>
  <div class="shell"><header class="topbar"><a href="../../index.html">← All G4mes</a><a class="brand" href="../../index.html">CYBERIA<span>.</span></a></header>
    <main><h1>PONG<span>.</span></h1><p class="subtitle">First to 7 wins. Choose your match.</p>
      <div class="scoreboard"><div><small id="left-name">LEFT</small><strong class="left-score" id="left-score">0</strong></div><b>:</b><div><small id="right-name">RIGHT</small><strong class="right-score" id="right-score">0</strong></div></div>
      <div class="arena"><canvas id="pong-canvas" width="900" height="500" aria-label="Pong arena"></canvas>
        <div class="screen" id="setup"><div class="menu-card"><h2>Choose your G4me</h2><p>Play a friend on one keyboard or challenge the bot.</p><div class="choices"><button class="choice" type="button" data-mode="friend">You vs friend</button><button class="choice" type="button" data-mode="bot">You vs bot</button></div><div class="side-pick" id="side-pick" hidden><p>Choose which side you control.</p><div class="choices"><button class="choice" type="button" data-side="left">Play left</button><button class="choice" type="button" data-side="right">Play right</button></div></div><button class="primary" id="start" type="button" disabled>Start G4me →</button></div></div>
        <div class="screen" id="result" hidden><div class="menu-card"><h2 id="result-title">G4me over</h2><p id="result-text"></p><div class="choices"><button class="primary" id="rematch" type="button">Play again</button><button class="secondary" id="change-mode" type="button">Change mode</button></div></div></div>
      </div>
      <div class="below"><div class="controls" id="controls"><kbd>W</kbd> up / <kbd>D</kbd> down on left &nbsp;·&nbsp; <kbd>↑</kbd> up / <kbd>↓</kbd> down on right</div><div class="actions"><button class="secondary" id="restart" type="button">Restart ↻</button><button class="secondary" id="menu" type="button">Change mode</button></div></div>
      <div class="touch" aria-label="Touch paddle controls"><div class="group"><button type="button" data-key="KeyW" aria-label="Left paddle up">↑</button><button type="button" data-key="KeyD" aria-label="Left paddle down">↓</button></div><div class="group"><button type="button" data-key="ArrowUp" aria-label="Right paddle up">↑</button><button type="button" data-key="ArrowDown" aria-label="Right paddle down">↓</button></div></div>
    </main>
  </div>
</body>
</html>
